services:
  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: pulsar
      POSTGRES_USER: pulsar_zero
      POSTGRES_PASSWORD: ${PULSAR_ZERO_DB_PASSWORD:?Set PULSAR_ZERO_DB_PASSWORD}
      PULSAR_APP_DB_PASSWORD: ${PULSAR_APP_DB_PASSWORD:?Set PULSAR_APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_connections=100
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../zero-stage2/schema.sql:/docker-entrypoint-initdb.d/002-zero-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar_zero -d pulsar"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 1m
    restart: unless-stopped
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${PULSAR_WEB_IMAGE:-ghcr.io/testerhub-lab/tasks.testerhub:latest}
    env_file:
      - ${PULSAR_APP_ENV_FILE:?Set PULSAR_APP_ENV_FILE}
    environment:
      DATABASE_URL: postgresql://pulsar_app:${PULSAR_APP_DB_PASSWORD}@postgres:5432/pulsar
      ZERO_UPSTREAM_DB: postgresql://pulsar_app:${PULSAR_APP_DB_PASSWORD}@postgres:5432/pulsar
      PULSAR_AUTH_STORE: zero
      NEXT_PUBLIC_ZERO_CACHE_URL: ${PULSAR_ZERO_PUBLIC_URL:-https://pulsar.testerhub.ru/zero-cache}
    ports:
      - "127.0.0.1:${APP_PORT:-3012}:3000"
    volumes:
      - ${UPLOAD_DATA_DIR:-/srv/tasks/data/uploads}:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  zero-cache:
    image: rocicorp/zero:1.8.0
    environment:
      NODE_ENV: production
      ZERO_APP_ID: pulsar_production
      ZERO_APP_PUBLICATIONS: pulsar_zero_data
      ZERO_UPSTREAM_DB: postgresql://pulsar_zero:${PULSAR_ZERO_DB_PASSWORD}@postgres:5432/pulsar
      ZERO_CVR_DB: postgresql://pulsar_zero:${PULSAR_ZERO_DB_PASSWORD}@postgres:5432/pulsar
      ZERO_CHANGE_DB: postgresql://pulsar_zero:${PULSAR_ZERO_DB_PASSWORD}@postgres:5432/pulsar
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?Set ZERO_ADMIN_PASSWORD}
      ZERO_QUERY_URL: http://web:3000/api/zero/query
      ZERO_MUTATE_URL: http://web:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_ENABLE_TELEMETRY: "false"
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
      OTEL_METRICS_EXPORTER: ""
      OTEL_LOGS_EXPORTER: ""
      OTEL_TRACES_EXPORTER: ""
    ports:
      - "127.0.0.1:${ZERO_CACHE_PORT:-4848}:4848"
    volumes:
      - zero-cache-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2m
    stop_grace_period: 10m
    restart: unless-stopped
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
  zero-cache-data:

networks:
  edge:
  data:
    internal: true
