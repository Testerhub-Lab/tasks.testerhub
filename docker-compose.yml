services:
  web:
    build: .
    image: ghcr.io/testerhub-lab/tasks.testerhub:latest
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - "${UPLOAD_DATA_DIR:-./data/uploads}:/app/data/uploads"
    restart: unless-stopped
    # Доступ к БД на хосте: из контейнера используйте host.docker.internal в DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
