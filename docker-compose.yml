services:
  web:
    image: ghcr.io/testerhub-lab/tasks.testerhub:latest
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/public/uploads
    restart: unless-stopped
    # Доступ к БД на хосте: из контейнера используйте host.docker.internal в DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
