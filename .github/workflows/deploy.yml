name: Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REPO_NAME: tasks.testerhub

# Уведомления в Telegram: в Settings → Secrets → Actions добавьте TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID.
# chat_id: напишите боту в ЛС или добавьте в группу, затем GET https://api.telegram.org/bot<TOKEN>/getUpdates — в ответе chat.id

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify deploy started
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TEXT="🚀 Деплой ${{ env.REPO_NAME }} запущен
          Ветка: ${{ github.ref_name }}
          Коммит: ${SHORT_SHA} ${{ github.event.head_commit.message }}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/testerhub-lab/tasks.testerhub:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          command_timeout: 30m
          script: |
            set -e
            cd /srv/tasks
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker compose pull
            docker compose run --rm web npx prisma migrate deploy
            docker compose up -d
            docker image prune -f

      - name: Notify deploy success
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TEXT="✅ Деплой ${{ env.REPO_NAME }} успешен
          Коммит: ${SHORT_SHA}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: ${{ always() && needs.build-and-deploy.result == 'failure' }}
    steps:
      - name: Notify deploy failed
        run: |
          TEXT="❌ Деплой ${{ env.REPO_NAME }} провалился
          Ветка: ${{ github.ref_name }}
          Коммит: ${{ github.sha }}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true
