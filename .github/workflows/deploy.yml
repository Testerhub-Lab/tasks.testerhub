name: Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  REPO_NAME: tasks.testerhub

# Уведомления в Telegram: в Settings → Secrets → Actions добавьте TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID.
# chat_id: напишите боту в ЛС или добавьте в группу, затем GET https://api.telegram.org/bot<TOKEN>/getUpdates — в ответе chat.id

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify deploy started
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TEXT="🚀 Деплой ${{ env.REPO_NAME }} запущен
          Ветка: ${{ github.ref_name }}
          Коммит: ${SHORT_SHA} ${{ github.event.head_commit.message }}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_DIR=/home/deploy/tasks-source
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone https://github.com/Testerhub-Lab/tasks.testerhub.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            install -m 600 /srv/tasks/.env .env
            export UPLOAD_DATA_DIR=/srv/tasks/data/uploads
            docker compose -p tasks build --pull web
            docker compose -p tasks run --rm web npx prisma migrate deploy
            docker compose -p tasks up -d --remove-orphans
            docker image prune -f

      - name: Notify deploy success
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TEXT="✅ Деплой ${{ env.REPO_NAME }} успешен
          Коммит: ${SHORT_SHA}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: ${{ always() && needs.build-and-deploy.result == 'failure' }}
    steps:
      - name: Notify deploy failed
        run: |
          TEXT="❌ Деплой ${{ env.REPO_NAME }} провалился
          Ветка: ${{ github.ref_name }}
          Коммит: ${{ github.sha }}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXT" | jq -Rs .)}" \
            || true
